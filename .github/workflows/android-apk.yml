name: Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Optional: load a hosted site instead of the offline app baked into the APK"
        required: false
        default: ""
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apk:
    if: "github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Resolve release identity
        id: meta
        run: |
          version=$(node -p "require('./package.json').version")
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            tag="${{ github.ref_name }}"
            if [ "$tag" != "v$version" ]; then
              echo "Tag $tag does not match package version v$version"; exit 1
            fi
          else
            tag="v$version"
          fi
          {
            echo "version=$version"
            echo "build_number=$(git rev-list --count HEAD)"
            echo "tag=$tag"
            echo "commit=$GITHUB_SHA"
            echo "release_id=$tag-$short"
          } >> "$GITHUB_OUTPUT"

      # No web environment is provided to this job on purpose: the APK is
      # handed to other shops and must carry no project address, key or
      # backend URL. The phone is told where to connect during activation or
      # in Settings -> Database & Cloud Connection.
      - name: Build the offline app bundle
        if: ${{ !inputs.app_url }}
        run: npm run mobile:build

      - name: Add Android platform
        env:
          POS_MOBILE_URL: ${{ inputs.app_url }}
        run: |
          npx cap add android || true
          npx cap sync android
          node scripts/android-permissions.cjs

      - name: Validate Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "Missing required GitHub secret: $name"; exit 1; fi
          done

      - name: Configure signed upgrade build
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/release.keystore
          ANDROID_VERSION_NAME: ${{ steps.meta.outputs.version }}
          ANDROID_VERSION_CODE: ${{ steps.meta.outputs.build_number }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode --ignore-garbage > "$ANDROID_KEYSTORE_FILE"
          if [ ! -s "$ANDROID_KEYSTORE_FILE" ]; then
            echo "Decoded keystore is empty — check the ANDROID_KEYSTORE_BASE64 secret."; exit 1
          fi
          node scripts/android-release.cjs

      - name: Verify generated camera permission
        run: grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/release.keystore
        run: |
          ./gradlew assembleRelease --stacktrace





      - name: Stage the APK and the web bundle
        run: |
          v="${{ steps.meta.outputs.version }}"
          rid="${{ steps.meta.outputs.release_id }}"
          released=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          epoch=$(node -e "const m=/BUNDLE_EPOCH\s*=\s*(\d+)/.exec(require('fs').readFileSync('src/lib/bundle-epoch.ts','utf8'));if(!m){process.exit(1)}console.log(m[1])")
          mkdir -p versioned/android/web latest/android latest/android/web release-assets
          src=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          cp "$src" "versioned/android/NorthwindPOS-$v.apk"
          cp "$src" "latest/android/NorthwindPOS-$v.apk"
          cp "$src" "latest/android/NorthwindPOS-latest.apk"
          cp "$src" "release-assets/NorthwindPOS-$v.apk"
          manifest=$(printf '{"version":"%s","file":"NorthwindPOS-%s.apk","tag":"%s","commit":"%s","released":"%s","path":"pos-app/releases/%s/android/"}\n' \
            "$v" "$v" "${{ steps.meta.outputs.tag }}" "${{ steps.meta.outputs.commit }}" "$released" "$rid")
          echo "$manifest" > latest/android/latest.json
          echo "$manifest" > versioned/android/latest.json
          echo "$manifest" > release-assets/latest.json
          # Unified cross-platform manifest read by Android, Windows and web.
          base="https://updatecms.luckycharmsdnbhd.com/pos-app"
          build="${{ steps.meta.outputs.build_number }}"
          printf '{"version":"%s","buildNumber":%s,"releaseNotes":"%s","apkUrl":"%s/latest/android/NorthwindPOS-%s.apk","bundleUrl":"%s/latest/android/web/web-%s.zip","bundleEpoch":%s,"windowsUrl":"%s/latest/LovablePOS%%20Setup%%20%s.exe"}\n' \
            "$v" "$build" "Release $v" "$base" "$v" "$base" "$v" "$epoch" "$base" "$v" > release-assets/manifest.json
          cp release-assets/manifest.json latest/manifest.json 2>/dev/null || { mkdir -p latest && cp release-assets/manifest.json latest/manifest.json; }
          if [ -z "${{ inputs.app_url }}" ]; then
            (cd capacitor-shell && zip -qr "$GITHUB_WORKSPACE/versioned/android/web/web-$v.zip" .)
            cp "versioned/android/web/web-$v.zip" "latest/android/web/web-$v.zip"
            cp "versioned/android/web/web-$v.zip" "latest/android/web/web-latest.zip"
            web=$(printf '{"version":"%s","file":"web-%s.zip","bundleEpoch":%s,"tag":"%s","commit":"%s","released":"%s"}\n' \
              "$v" "$v" "$epoch" "${{ steps.meta.outputs.tag }}" "${{ steps.meta.outputs.commit }}" "$released")
            echo "$web" > latest/android/web/latest.json
            echo "$web" > versioned/android/web/latest.json
          fi




      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NorthwindPOS-android
          if-no-files-found: error
          path: release-assets/*.apk

      # A hosted-shell build points the APK at someone else's running site, so
      # it is a test build only and must never reach the release channel.
      - name: Deploy to Cloudflare R2
        if: ${{ !inputs.app_url }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$R2_ENDPOINT" ]; then
            echo "R2 credentials are not configured; skipping upload."; exit 0
          fi
          rid="${{ steps.meta.outputs.release_id }}"
          aws s3 sync versioned/android "s3://updatelccms/pos-app/releases/$rid/android" \
            --endpoint-url "$R2_ENDPOINT" --cache-control "public,max-age=31536000,immutable"
          aws s3 sync latest/android s3://updatelccms/pos-app/latest/android \
            --endpoint-url "$R2_ENDPOINT" --cache-control "no-cache" --delete
          aws s3 sync latest/android s3://updatelccms/pos-app/android \
            --endpoint-url "$R2_ENDPOINT" --cache-control "no-cache" --delete
          # Root manifest.json — the single feed every platform reads.
          aws s3 cp release-assets/manifest.json s3://updatelccms/pos-app/manifest.json \
            --endpoint-url "$R2_ENDPOINT" --cache-control "no-cache" \
            --content-type "application/json"

      - name: Keep only the five most recent releases
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$R2_ENDPOINT" ]; then exit 0; fi
          RETAIN=5
          folders=$(aws s3 ls s3://updatelccms/pos-app/releases/ \
            --endpoint-url "$R2_ENDPOINT" | awk '/PRE/ {print $2}' | sort)
          total=$(echo "$folders" | grep -c . || true)
          if [ "$total" -le "$RETAIN" ]; then echo "Nothing to prune ($total kept)."; exit 0; fi
          echo "$folders" | head -n "$((total - RETAIN))" | while read -r old; do
            [ -z "$old" ] && continue
            echo "Removing old release $old"
            aws s3 rm "s3://updatelccms/pos-app/releases/$old" --recursive \
              --endpoint-url "$R2_ENDPOINT" || true
          done

      - name: Attach APK to the GitHub release
        if: ${{ !inputs.app_url && startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release-assets/*.apk
            release-assets/latest.json
