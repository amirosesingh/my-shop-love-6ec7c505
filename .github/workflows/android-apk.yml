name: Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Optional: load a hosted site instead of the offline app baked into the APK"
        required: false
        default: ""
  push:
    tags:
      - "v*"

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apk:
    name: Build and publish the Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read app version
        id: meta
        run: |
          version=$(node -p "require('./package.json').version")
          short_sha="${GITHUB_SHA:0:7}"
          case "$GITHUB_REF" in
            refs/tags/*) tag="${GITHUB_REF#refs/tags/}" ;;
            *) tag="v$version" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$short_sha" >> "$GITHUB_OUTPUT"
          echo "release_id=$tag-$short_sha" >> "$GITHUB_OUTPUT"

      - name: Build the offline app bundle
        if: ${{ !inputs.app_url }}
        run: bun run mobile:build

      - name: Add Android platform
        env:
          # Empty = fully offline APK (the app is baked in). Only a URL typed
          # into the workflow input turns the build into a thin online shell.
          POS_MOBILE_URL: ${{ inputs.app_url }}
        run: |
          npx cap add android || true
          npx cap sync android
          node scripts/android-permissions.cjs

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      # For a store-ready build: add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD as repository secrets, then swap the
      # step above for `./gradlew assembleRelease` with the signing config wired in.

      - name: Stage APK for upload
        id: stage
        env:
          RELEASE_ID: ${{ steps.meta.outputs.release_id }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          mkdir -p android-release android-versioned
          src=$(ls android/app/build/outputs/apk/debug/*.apk | head -n1)
          v="${{ steps.meta.outputs.version }}"
          cp "$src" "android-release/NorthwindPOS-$v.apk"
          cp "$src" "android-release/NorthwindPOS-latest.apk"
          cp "$src" "android-versioned/NorthwindPOS-$v.apk"
          printf '{"version":"%s","file":"NorthwindPOS-%s.apk","released":"%s","tag":"%s","commit":"%s","path":"pos-app/releases/%s/android"}\n' \
            "$v" "$v" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$RELEASE_TAG" "$RELEASE_COMMIT" "$RELEASE_ID" \
            > android-release/latest.json
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Stage the live web bundle
        if: ${{ !inputs.app_url }}
        env:
          RELEASE_ID: ${{ steps.meta.outputs.release_id }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          mkdir -p android-web
          v="${{ steps.meta.outputs.version }}"
          (cd capacitor-shell && zip -qr "../android-web/web-$v.zip" .)
          cp "android-web/web-$v.zip" android-web/web-latest.zip
          printf '{"version":"%s","file":"web-%s.zip","released":"%s","tag":"%s","commit":"%s","path":"pos-app/releases/%s/android/web"}\n' \
            "$v" "$v" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$RELEASE_TAG" "$RELEASE_COMMIT" "$RELEASE_ID" \
            > android-web/latest.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NorthwindPOS-android
          if-no-files-found: error
          path: android-release/*.apk

      - name: Deploy APK to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          RELEASE_ID: ${{ steps.meta.outputs.release_id }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$R2_ENDPOINT" ]; then
            echo "R2 credentials are not configured; skipping the update-feed upload."
            exit 0
          fi
          base="s3://updatelccms/pos-app"

          # 1. Immutable, versioned copies.
          aws s3 sync android-versioned "$base/releases/$RELEASE_ID/android" \
            --cache-control "public,max-age=31536000,immutable" \
            --endpoint-url "$R2_ENDPOINT"

          # 2. Stable pointers the phones poll.
          aws s3 sync android-release "$base/latest/android" \
            --cache-control "no-cache" \
            --endpoint-url "$R2_ENDPOINT"

          # 3. Legacy path, kept for already-deployed devices.
          aws s3 sync android-release s3://updatelccms/pos-app/android \
            --cache-control "no-cache" \
            --endpoint-url "$R2_ENDPOINT"
          if [ -d android-web ]; then
            aws s3 sync android-web "$base/releases/$RELEASE_ID/android/web" \
              --exclude "web-latest.zip" \
              --cache-control "public,max-age=31536000,immutable" \
              --endpoint-url "$R2_ENDPOINT"
            aws s3 sync android-web "$base/latest/android/web" \
              --cache-control "no-cache" \
              --endpoint-url "$R2_ENDPOINT"
            aws s3 sync android-web s3://updatelccms/pos-app/android/web \
              --cache-control "no-cache" \
              --endpoint-url "$R2_ENDPOINT"
          fi

      - name: Attach APK to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: android-release/*.apk
