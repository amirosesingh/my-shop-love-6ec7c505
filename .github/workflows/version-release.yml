name: Prepare release version

on:
  push:
    branches: [main]

concurrency:
  group: prepare-release-version
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bump:
    if: "!contains(github.event.head_commit.message, '[release]') && !contains(github.event.head_commit.message, '[skip release]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Increase shared application version
        id: version
        run: |
          git pull --ff-only origin main
          version=$(node scripts/bump-version.cjs)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit release version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/version.ts
          git commit -m "chore: release v${{ steps.version.outputs.version }} [release]"
          git push origin HEAD:main
