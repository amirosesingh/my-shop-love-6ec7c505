name: Security checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guardrails:
    name: Role & permission regression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Permission & route-guard tests
        run: bunx vitest run
      - name: Lint
        run: bun run lint
      - name: Typecheck & build
        run: bun run build
      - name: Dependency vulnerability audit
        run: bunx --bun npm audit --audit-level=high || exit 1