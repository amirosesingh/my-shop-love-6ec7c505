name: Desktop release (Windows .exe)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      update_url:
        description: "Web folder that will host the installer + latest.yml"
        required: false
        default: ""

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        env:
          # Repository variable POS_UPDATE_URL (Settings -> Variables) is the
          # web folder the tills poll; the manual input overrides it.
          POS_UPDATE_URL: ${{ inputs.update_url || vars.POS_UPDATE_URL }}
        run: npm run desktop:release

      - name: Upload installer + update manifest
        uses: actions/upload-artifact@v4
        with:
          name: LovablePOS-windows
          if-no-files-found: error
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap