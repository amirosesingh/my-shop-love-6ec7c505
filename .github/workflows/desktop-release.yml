name: Desktop release (Windows)

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Windows-only paths: a change confined to src/platforms/mobile must not
    # rebuild the desktop installer. TODO: add code-signing once a Windows
    # certificate is available; the build is currently unsigned.
    paths:
      - "src/core/**"
      - "src/platform-config/**"
      - "src/platforms/windows/**"
      - "src/lib/**"
      - "src/components/**"
      - "src/routes/**"
      - "electron/**"
      - "scripts/desktop-release.cjs"
      - "vite.config.ts"
      - "package.json"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-windows:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install


      - name: Resolve release identity
        id: meta
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="v$version"
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "commit=$GITHUB_SHA"
            echo "release_id=$tag-$short"
          } >> "$GITHUB_OUTPUT"

      # POS_UPDATE_URL is the update feed address, not tenant configuration.
      # No web environment (Supabase URL/key, backend URL) is provided to this
      # job: the till is told where to connect during activation or in
      # Settings -> Database & Cloud Connection.
      - name: Build Electron installer
        env:
          POS_UPDATE_URL: ${{ vars.POS_UPDATE_URL }}
        run: npm run desktop:release

      - name: Verify the installer carries no web configuration
        shell: bash
        run: node scripts/verify-no-web-config.cjs release dist-desktop

      - name: Write release manifest
        shell: bash
        run: |
          node -e "const fs=require('fs');fs.writeFileSync('release/release.json',JSON.stringify({version:'${{ steps.meta.outputs.version }}',tag:'${{ steps.meta.outputs.tag }}',commit:'${{ steps.meta.outputs.commit }}',released:new Date().toISOString(),path:'pos-app/releases/${{ steps.meta.outputs.release_id }}/'},null,2))"

      - name: Stage publishable files only
        shell: bash
        run: |
          # electron-builder also leaves win-unpacked/, builder-debug.yml and
          # other build scratch in release/. Only the files a till downloads
          # are copied into the upload folder, so the bucket stays clean.
          rm -rf upload && mkdir -p upload
          shopt -s nullglob
          for f in release/*.exe release/*.exe.blockmap release/latest.yml release/release.json; do
            cp "$f" upload/
          done
          ls -la upload

      - name: Deploy to Cloudflare R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$R2_ENDPOINT" ]; then
            echo "R2 credentials are not configured; skipping upload."; exit 0
          fi
          rid="${{ steps.meta.outputs.release_id }}"
          # Immutable, versioned copy.
          aws s3 sync upload "s3://updatelccms/pos-app/releases/$rid" \
            --endpoint-url "$R2_ENDPOINT" \
            --cache-control "public,max-age=31536000,immutable"
          # Stable pointers the tills poll.
          # --delete clears anything left behind by earlier releases
          # (win-unpacked/ and friends) on the next run.
          # The Android release owns latest/android/** and latest/manifest.json,
          # so they are excluded from the prune — otherwise a Windows release
          # silently deletes the APK the phones are told to download.
          aws s3 sync upload s3://updatelccms/pos-app/latest \
            --endpoint-url "$R2_ENDPOINT" --cache-control "no-cache" --delete \
            --exclude "android/*" --exclude "manifest.json"
          # Tills already in the field read the top-level path, so the same
          # allowlisted files are mirrored there (without --delete, which
          # would wipe releases/ and latest/).
          aws s3 sync upload s3://updatelccms/pos-app \
            --endpoint-url "$R2_ENDPOINT" --cache-control "no-cache"

      - name: Remove build scratch left in the bucket by earlier releases
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$R2_ENDPOINT" ]; then exit 0; fi
          for stray in win-unpacked builder-debug.yml builder-effective-config.yaml .icon-ico .cache; do
            aws s3 rm "s3://updatelccms/pos-app/$stray" --recursive \
              --endpoint-url "$R2_ENDPOINT" || true
            aws s3 rm "s3://updatelccms/pos-app/latest/$stray" --recursive \
              --endpoint-url "$R2_ENDPOINT" || true
          done

      - name: Attach installer to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
            release/release.json
