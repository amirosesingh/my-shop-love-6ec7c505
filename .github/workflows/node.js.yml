name: Build & Deploy POS App to Cloudflare R2

on:
  push:
    # Triggers automatic build whenever you push a version tag like v1.0.1
    tags:
      - 'v*'
  # Allows you to click "Run workflow" manually from GitHub UI
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1. Pull code from your repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Install npm dependencies cleanly
      - name: Install Dependencies
        run: npm install

      # 4. Compile React & package Electron into .exe
      - name: Build Electron (.exe)
        run: npm run desktop:release
# 5. Upload files to Cloudflare R2 using pre-installed AWS CLI on Windows
      - name: Deploy to Cloudflare R2
        shell: powershell
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 sync release s3://updatelccms/pos-app --endpoint-url ${{ secrets.R2_ENDPOINT }}
      
