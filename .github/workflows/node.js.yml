name: Build & Deploy POS App to Cloudflare R2

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# Never let two releases upload over each other.
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build-windows:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Electron (.exe)
        env:
          POS_UPDATE_URL: ${{ vars.POS_UPDATE_URL }}
        run: npm run desktop:release

      - name: Deploy to Cloudflare R2
        shell: powershell
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 sync release s3://updatelccms/pos-app --endpoint-url ${{ secrets.R2_ENDPOINT }}

      - name: Attach installer to a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version || github.ref_name }}
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
